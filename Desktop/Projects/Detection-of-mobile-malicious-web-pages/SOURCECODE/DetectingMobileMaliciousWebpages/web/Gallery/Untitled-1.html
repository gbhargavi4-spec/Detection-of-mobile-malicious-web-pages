<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .body {
            margin: 0;
        }

        .container {
            width: 100%;
            height: 70vh;
        }

        .header {
            background-color: green;
        }

        .logo {
            background-color: red;
            text-align: center;
            width: 20%;
        }

        .heading {
            background-color: green;
            width: 80%;
            text-align: center;
        }

        .menu {
            background-color: yellow;
            text-align: center;

        }

        .section1 {
            background-color: blue;
            text-align: center;
            width: 33%;
            height: 60px;

        }

        .section2 {
            background-color: gray;
            text-align: center;
            width: 33%;
            height: 60px;

        }

        .section3 {
            background-color: plum;
            text-align: center;
            width: 33%;
            height: 60px;

        }

        .contents {
            background-color: lightgreen;
            text-align: center;
            height: 80px;
            width: 60px;
        }

        .sidebar {
            background-color: olive;
            text-align: center;
        }

        .footer {
            background-color: skyblue;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo">Logo</div>
            <div class="heading">Website heading</div>
        </div>

        <div class="menu">Menu</div>

        <div class="section">
            <div class="section1">Section 1</div>
            <div class="section2">Section 2</div>
            <div class="section3">Section 3</div>
        </div>

        <div>
            <div class="contents">Page contents</div>
            <div class="sidebar">Side bar</div>
        </div>

        <div class="footer">Page Footer</div>
    </div>
</body>

</html>
